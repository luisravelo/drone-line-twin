[project]
name = "dronetwin"
version = "0.2.0"
description = "Digital twin + discrete event simulation of a high-mix FPV drone GA line"
requires-python = ">=3.11"
dependencies = ["simpy>=4.1", "numpy>=1.26", "pandas>=2.2", "pyyaml>=6", "plotly>=5.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]
usd = ["usd-core>=24.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
